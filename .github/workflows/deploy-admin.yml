name: Deploy OnPeak Admin to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'onpeak-admin/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: onpeak-admin-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: onpeak-admin/package-lock.json

      - name: Install dependencies
        working-directory: onpeak-admin
        run: npm ci || npm install

      - name: Configure Supabase env for build
        working-directory: onpeak-admin
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_URL:-}" ] && [ -n "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Using Supabase configuration from repository secrets."
            : > .env.production
            echo "VITE_SUPABASE_URL=${SUPABASE_URL}" >> .env.production
            echo "VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}" >> .env.production
          elif [ -f .env.production ] && grep -q '^VITE_SUPABASE_URL=https://' .env.production && grep -q '^VITE_SUPABASE_ANON_KEY=.' .env.production; then
            echo "Using committed .env.production defaults."
          else
            echo "::error::Supabase configuration is missing."
            exit 1
          fi

      - name: Build admin site
        working-directory: onpeak-admin
        run: npm run build

      - name: Add SPA redirect
        working-directory: onpeak-admin
        run: |
          mkdir -p dist
          echo '/* /index.html 200' > dist/_redirects

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: onpeak-admin/dist

  deploy:
    environment:
      name: onpeak-admin-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
