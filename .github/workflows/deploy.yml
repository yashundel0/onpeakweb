name: Deploy Vite React site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Supabase env for build
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          # A committed .env.production provides public default values so the
          # build can run without secrets. Repository secrets, when set, take
          # precedence and override those defaults.
          if [ -n "${SUPABASE_URL:-}" ] && [ -n "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Using Supabase configuration from repository secrets."
            : > .env.production
            echo "VITE_SUPABASE_URL=${SUPABASE_URL}" >> .env.production
            echo "VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}" >> .env.production
          elif [ -f .env.production ] && grep -q '^VITE_SUPABASE_URL=https://' .env.production && grep -q '^VITE_SUPABASE_ANON_KEY=.' .env.production; then
            echo "Using committed .env.production defaults."
          else
            echo "::error::Supabase configuration is missing. Either add repository secrets VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in Settings > Secrets and variables > Actions, or commit a .env.production file with public anon values."
            exit 1
          fi

      - name: Build site
        run: npm run build

      - name: Verify Supabase config in bundle
        run: |
          if ! grep -q "oqsmadifgigiqielbuaz\|supabase.co" dist/assets/index-*.js 2>/dev/null; then
            echo "::error::Supabase URL not found in production bundle — env vars were not embedded."
            exit 1
          fi
          echo "Supabase configuration verified in production bundle."

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
